name: docs

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - run: pip install .
      - run: pip install -r requirements-docs.txt
      # The Brep backend: the contact-detection examples need it to build a scene.
      - run: pip install -r requirements-brep.txt
      # The viewer APP is committed (docs/assets/viewer/*.html|js|wasm), so there is
      # nothing to fetch here. This runs every example for real and writes the
      # geometry each page loads: docs/assets/viewer/pb/*.pb + scenes/*.json.
      - run: python tools/build_scenes.py
      - run: mkdocs gh-deploy --force
