site_name: COMPAS WOOD
site_url: https://petrasvestartas.github.io/compas_wood
site_description: COMPAS-friendly interface to the wood_nano timber joinery kernel.

repo_name: petrasvestartas/compas_wood
repo_url: https://github.com/petrasvestartas/compas_wood/

copyright: Copyright &copy; Petras Vestartas

# Port 8000 (the mkdocs default) is often taken on dev machines by Apache/XAMPP
# and similar; pin a quieter port so `mkdocs serve` works with no arguments.
dev_addr: 127.0.0.1:8001

extra:
  homepage: https://petrasvestartas.github.io/compas_wood

extra_css:
  - assets/css/viewer.css
  - assets/css/nav.css
  - assets/css/editor.css
  - https://cdn.jsdelivr.net/npm/thebe@0.9.3/lib/thebe.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/thebe@0.9.3/lib/index.js
  - assets/js/thebe-init.js

theme:
  name: material
  # overrides/main.html replaces both sidebars with a top strip of menus.
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/images/compas_icon_white.png
  favicon: assets/images/compas_icon_white.png
  features:
    - content.code.copy
    - content.footnote.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - callouts:
      strip_period: no
  - footnotes
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
      # changelog.md and license.md pull CHANGELOG.md / LICENSE from the repo root.
      base_path: ["."]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: "¤"

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src] # search packages in the src folder
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://compas.dev/compas/latest/objects.inv
          options:
            allow_inspection: true
            backlinks: tree
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true
            docstring_style: numpy
            docstring_section_style: table
            filters: public
            group_by_category: true
            heading_level: 1
            inheritance_diagram_direction: TD
            inherited_members: false
            line_length: 88
            merge_init_into_class: true
            modernize_annotations: true
            parameter_headings: false
            preload_modules: [mkdocstrings, compas]
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_category_heading: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_modules: false
            show_if_no_docstring: false
            show_inheritance_diagram: false
            show_root_heading: true
            show_root_full_path: true
            show_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            show_source: false
            show_submodules: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary:
              modules: false
            type_parameter_headings: true
            unwrap_annotated: true

nav:
  - Getting Started:
      - Introduction: index.md
      - Installation: installation.md
      - Migration from 2.x: migration.md
  - Examples:
      - Contact detection:
          - Brep workflow: examples/brep_workflow.md
          - Brep outlines: examples/brep_outlines.md
          - Joinery solver from Breps: examples/joinery_solver_from_breps.md
          - Contact detection on the compas_tf floor: examples/contact_detection_tf.md
          - Contact detection stress test: examples/contact_detection_tf_stress.md
      - Joinery:
          - Solver parameters: examples/joinery_parameters.md
          - Templates:
              - Hello: examples/hello.md
              - Translation shell: examples/translation_shell.md
              - Reflex fold: examples/reflex_fold.md
              - Chevron: examples/chevron.md
              - Diamond mesh: examples/diamond_mesh.md
              - Connectors: examples/connectors.md
              - Reciprocal move: examples/reciprocal_move.md
              - Reciprocal rotation: examples/reciprocal_rotation.md
          - Solver:
              - Joinery solver: examples/joinery_solver.md
              - Translation shell joinery: examples/joinery_solver_translation_shell.md
              - Chevron joinery: examples/joinery_solver_chevron.md
              - Diamond mesh joinery: examples/joinery_solver_diamond_mesh.md
              - Reciprocal frame (translation) joinery: examples/joinery_solver_reciprocal_move.md
              - Reciprocal frame (rotation) joinery: examples/joinery_solver_reciprocal_rotation.md
              - Connectivity table: examples/joinery_solver_connectivity.md
              - Assign joint types: examples/assign_joint_types.md
              - Assign insertion direction: examples/assign_insertion_direction.md
              - Datasets browser: examples/datasets_browser.md
  - About:
      - Changelog: changelog.md
      - License: license.md
      - API Reference:
          - Overview: api/index.md
          - compas_wood.assign_vectors: api/compas_wood.assign_vectors.md
          - compas_wood.brep: api/compas_wood.brep.md
          - compas_wood.chevron: api/compas_wood.chevron.md
          - compas_wood.connectors: api/compas_wood.connectors.md
          - compas_wood.convert: api/compas_wood.convert.md
          - compas_wood.datasets: api/compas_wood.datasets.md
          - compas_wood.diamond_mesh: api/compas_wood.diamond_mesh.md
          - compas_wood.joinery_solver: api/compas_wood.joinery_solver.md
          - compas_wood.loft: api/compas_wood.loft.md
          - compas_wood.model: api/compas_wood.model.md
          - compas_wood.reciprocal_move: api/compas_wood.reciprocal_move.md
          - compas_wood.reciprocal_rotation: api/compas_wood.reciprocal_rotation.md
          - compas_wood.reflex_fold: api/compas_wood.reflex_fold.md
          - compas_wood.translation_shell: api/compas_wood.translation_shell.md
          - compas_wood.session_scene: api/compas_wood.session_scene.md
          - compas_wood.viewer: api/compas_wood.viewer.md
          - compas_wood.wood_element: api/compas_wood.wood_element.md
